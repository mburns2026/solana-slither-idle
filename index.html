<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Solana Slither.Idle ($SLITHERI) - v0.4</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#05070a;font-family:'Rajdhani',sans-serif;color:#fff}
#game-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;touch-action:none}

/* HUD HUD SLITHER STYLE */
.hud-layer{position:absolute;z-index:10;pointer-events:none}
.hud-layer *{pointer-events:auto}

/* TOP LEFT: MINIMAP & BRAND */
#top-left-hud{top:15px;left:15px;display:flex;flex-direction:column;gap:10px}
#minimap-card{background:rgba(10,12,20,0.65);border:1px solid rgba(153,69,255,0.4);border-radius:50%;width:110px;height:110px;position:relative;overflow:hidden;box-shadow:0 0 15px rgba(0,0,0,0.8)}
#minimap{width:100%;height:100%}

/* TOP RIGHT: LEADERBOARD SLITHER STYLE */
#leaderboard-hud{top:15px;right:15px;background:rgba(10,12,20,0.5);border-radius:10px;padding:10px 14px;min-width:180px;font-family:'Rajdhani',sans-serif}
#leaderboard-hud h3{font-family:'Orbitron',sans-serif;font-size:13px;color:#14f195;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:4px}
.lb-row{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:2px}
.lb-row.me{color:#14f195}

/* BOTTOM RIGHT: LENGTH & RANK */
#bottom-right-hud{bottom:15px;right:20px;text-align:right;font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700;text-shadow:0 2px 4px #000}

/* BOTTOM LEFT: CONTROLS & IDLE BOT */
#controls-hud{bottom:15px;left:15px;display:flex;flex-direction:column;gap:8px}
.btn-group{display:flex;gap:8px}
.btn{background:linear-gradient(135deg,#9945ff,#14f195);border:0;border-radius:6px;color:#000;font:800 12px Orbitron,sans-serif;padding:8px 14px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,0.5)}
.btn.sec{background:rgba(20,24,35,0.8);color:#fff;border:1px solid rgba(255,255,255,0.2)}
.btn.on{background:linear-gradient(135deg,#14f195,#9945ff)}

/* MODAL SYSTEM */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);z-index:100;display:none;align-items:center;justify-content:center}
.modal{background:#0e111a;border:1px solid #9945ff;border-radius:16px;width:90%;max-width:600px;padding:24px;position:relative}
.close{position:absolute;top:14px;right:16px;background:none;border:0;color:#888;font-size:22px;cursor:pointer}
#toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:50;background:rgba(18,16,38,0.95);border:1px solid #14f195;border-radius:8px;padding:8px 16px;font:700 13px Orbitron,sans-serif;opacity:0;transition:opacity .3s;pointer-events:none}
</style>
</head>
<body>

<canvas id="game-canvas"></canvas>
<div id="toast"></div>

<!-- HUD SLITHER STYLE -->
<div id="top-left-hud" class="hud-layer">
  <div id="minimap-card"><canvas id="minimap" width="110" height="110"></canvas></div>
  <div style="font-family:'Orbitron'; font-size:11px; color:#14f195; font-weight:700;">$SLITHERI: <span id="balance-display" style="color:#fff;">0.00</span></div>
</div>

<div id="leaderboard-hud" class="hud-layer">
  <h3>LEADERBOARD</h3>
  <div id="leader-list"></div>
</div>

<div id="bottom-right-hud" class="hud-layer">
  <div>Your length: <span id="snake-length" style="color:#fff">120</span></div>
  <div style="font-size:14px; color:#aaa">Your rank: <span id="snake-rank" style="color:#f3ba2f">#1</span></div>
</div>

<div id="controls-hud" class="hud-layer">
  <div class="btn-group">
    <button class="btn" id="bot-btn">🤖 AUTO-BOT: OFF</button>
    <button class="btn sec" id="shop-btn">🛒 LOJA</button>
    <button class="btn sec" id="info-btn">📜 INFO</button>
  </div>
</div>

<!-- MODAIS -->
<div id="shop-modal" class="overlay"><div class="modal">
  <button class="close" data-close="shop-modal">✕</button>
  <h2 style="font-family:'Orbitron'; color:#14f195; margin-bottom:12px;">LOJA $SLITHERI</h2>
  <p style="color:#aaa; font-size:13px; margin-bottom:15px;">Personalize sua cobra com skins clássicas e asas!</p>
</div></div>

<div id="info-modal" class="overlay"><div class="modal">
  <button class="close" data-close="info-modal">✕</button>
  <h2 style="font-family:'Orbitron'; color:#14f195; margin-bottom:12px;">Solana Slither.Idle</h2>
  <p style="color:#ccc; font-size:14px;">Jogo oficial P2E no ecossistema Solana com tokenomics $SLITHERI.</p>
</div></div>

<script>
const CONFIG = { WORLD: 3200, FOODS: 650, RIVALS: 14 };
const $ = id => document.getElementById(id);
const canvas = $('game-canvas'), ctx = canvas.getContext('2d');
const miniCtx = $('minimap').getContext('2d');
const W = CONFIG.WORLD;
const camera = {x: 0, y: 0};

// Carregar imagem da moeda oficial $SLITHERI
const coinImage = new Image();
coinImage.src = 'coin.png'; // Garanta que o nome do arquivo subido seja coin.png

// Jogador com visual estilo Slither
const player = {
  x: W/2, y: W/2, angle: 0, speed: 3.6, radius: 14, length: 120,
  tokens: 0, segments: [], autoBot: false, invulnUntil: 0,
  colors: ['#ff007f', '#00ffcc']
};

let foods = [], rivals = [], mouseX = innerWidth/2, mouseY = innerHeight/2;

function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', resize); resize();

function toast(msg){ const t = $('toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(toast.id); toast.id = setTimeout(() => t.style.opacity = 0, 1800); }

// Gerar Moedas
function newFood() {
  const isBig = Math.random() > 0.85;
  return {
    x: Math.random() * W, y: Math.random() * W,
    val: isBig ? 4 : 1,
    rad: isBig ? 14 : 9, // Tamanho ideal para visualização nítida da moeda
    glowColor: isBig ? '#14f195' : '#9945ff'
  };
}

// Gerar Rivais com Padrões de Cores Clássicos
function makeRival(i) {
  const colorSchemes = [
    ['#ffffff', '#cccccc'],
    ['#ff0000', '#ffff00', '#0000ff', '#00ff00'],
    ['#2ed573', '#1e90ff'],
    ['#ff4757', '#ffa502']
  ];
  return {
    name: ['Whoa', 'abcd', 'Kq', 'Mxxa', 'Sm0k3d', 'jcgonmor'][i % 6],
    x: Math.random() * W, y: Math.random() * W,
    angle: Math.random() * Math.PI * 2, speed: 3.0, radius: 14,
    length: 100 + Math.floor(Math.random()*250), segments: [],
    colors: colorSchemes[i % colorSchemes.length]
  };
}

for (let i = 0; i < CONFIG.FOODS; i++) foods.push(newFood());
for (let i = 0; i < CONFIG.RIVALS; i++) rivals.push(makeRival(i));

addEventListener('mousemove', e => { if (!player.autoBot) { mouseX = e.clientX; mouseY = e.clientY; } });

// Desenhar Fundo Hexagonal com Apelo 3D (Textura Slither.io)
function drawHexBackground() {
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const hexRadius = 35;
  const hexWidth = hexRadius * 2;
  const hexHeight = Math.sqrt(3) * hexRadius;

  const startX = Math.floor((camera.x - canvas.width) / hexWidth) * hexWidth;
  const endX = camera.x + canvas.width * 2;
  const startY = Math.floor((camera.y - canvas.height) / hexHeight) * hexHeight;
  const endY = camera.y + canvas.height * 2;

  ctx.strokeStyle = '#181f2a';
  ctx.lineWidth = 3;

  for (let x = startX; x < endX; x += hexRadius * 1.5) {
    for (let y = startY; y < endY; y += hexHeight) {
      let cy = y + ((Math.abs(x / (hexRadius * 1.5)) % 2 === 1) ? hexHeight / 2 : 0);
      
      ctx.beginPath();
      for (let side = 0; side < 6; side++) {
        let a = side * Math.PI / 3;
        let hx = x + hexRadius * Math.cos(a);
        let hy = cy + hexRadius * Math.sin(a);
        if (side === 0) ctx.moveTo(hx, hy);
        else ctx.lineTo(hx, hy);
      }
      ctx.closePath();
      ctx.stroke();
    }
  }
}

// Desenhar Cobra em Segmentos Circulares (Estilo Slither Original)
function drawSlitherSnake(snake, isPlayer = false) {
  if (snake.segments.length === 0) return;

  // Asas na cabeça
  if (isPlayer) {
    const head = snake.segments[0];
    ctx.save();
    ctx.translate(head.x, head.y);
    ctx.rotate(snake.angle);
    ctx.fillStyle = '#14f195';
    ctx.beginPath();
    ctx.ellipse(-5, -snake.radius * 1.4, 12, 5, Math.PI / 4, 0, Math.PI * 2);
    ctx.ellipse(-5, snake.radius * 1.4, 12, 5, -Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Corpo em Esferas Sobrepostas
  for (let i = snake.segments.length - 1; i >= 0; i--) {
    const seg = snake.segments[i];
    const color = snake.colors[i % snake.colors.length];

    ctx.beginPath();
    ctx.arc(seg.x, seg.y, snake.radius, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Olhos Googly Clássicos
  const head = snake.segments[0];
  ctx.save();
  ctx.translate(head.x, head.y);
  ctx.rotate(snake.angle);

  for (let eyeY of [-snake.radius * 0.5, snake.radius * 0.5]) {
    ctx.beginPath();
    ctx.arc(snake.radius * 0.4, eyeY, 5.5, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(snake.radius * 0.6, eyeY, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = '#000';
    ctx.fill();
  }
  ctx.restore();
}

function update() {
  if (!player.autoBot) {
    let dx = mouseX - canvas.width / 2;
    let dy = mouseY - canvas.height / 2;
    player.angle = Math.atan2(dy, dx);
  }

  player.x = Math.max(0, Math.min(W, player.x + Math.cos(player.angle) * player.speed));
  player.y = Math.max(0, Math.min(W, player.y + Math.sin(player.angle) * player.speed));

  player.segments.unshift({x: player.x, y: player.y});
  if (player.segments.length > player.length / 4) {
    player.segments.pop();
  }

  camera.x = player.x - canvas.width / 2;
  camera.y = player.y - canvas.height / 2;

  // Comer Moedas $SLITHERI
  for (let i = foods.length - 1; i >= 0; i--) {
    let f = foods[i];
    let dist = Math.hypot(f.x - player.x, f.y - player.y);
    if (dist < player.radius + f.rad + 6) {
      player.length += f.val * 3;
      player.tokens += f.val * 0.1;
      foods[i] = newFood();
    }
  }

  rivals.forEach(r => {
    r.angle += (Math.random() - 0.5) * 0.15;
    r.x = Math.max(0, Math.min(W, r.x + Math.cos(r.angle) * r.speed));
    r.y = Math.max(0, Math.min(W, r.y + Math.sin(r.angle) * r.speed));

    r.segments.unshift({x: r.x, y: r.y});
    if (r.segments.length > r.length / 4) r.segments.pop();
  });

  $('balance-display').textContent = player.tokens.toFixed(2);$('snake-length').textContent = Math.floor(player.length);
  updateLeaderboard();
}

function updateLeaderboard() {
  let list = [{name: 'Você', score: Math.floor(player.length * 10), me: true}];
  rivals.forEach(r => list.push({name: r.name, score: Math.floor(r.length * 10), me: false}));
  list.sort((a, b) => b.score - a.score);

  $('snake-rank').textContent = '#' + (list.findIndex(x => x.me) + 1);
  $('leader-list').innerHTML = list.slice(0, 6).map((it, i) =>
    `<div class="lb-row ${it.me ? 'me' : ''}"><span>#${i+1} ${it.name}</span><span>${it.score}</span></div>`
  ).join('');
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 1. Fundo Hexagonal
  drawHexBackground();

  ctx.save();
  ctx.translate(-camera.x, -camera.y);

  // 2. Renderizar a Moeda Oficial $SLITHERI com Efeito de Luz
  foods.forEach(f => {
    ctx.save();
    
    // Brilho Neon ao Redor da Moeda
    ctx.shadowColor = f.glowColor;
    ctx.shadowBlur = 12;

    if (coinImage.complete && coinImage.naturalWidth !== 0) {
      // Desenha a imagem real da moeda $SLITHERI
      ctx.drawImage(coinImage, f.x - f.rad, f.y - f.rad, f.rad * 2, f.rad * 2);
    } else {
      // Fallback visual enquanto a imagem carrega
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.rad, 0, Math.PI * 2);
      ctx.fillStyle = f.glowColor;
      ctx.fill();
    }

    ctx.restore();
  });

  // 3. Desenhar Rivais e Jogador
  rivals.forEach(r => drawSlitherSnake(r, false));
  drawSlitherSnake(player, true);

  ctx.restore();

  // 4. Minimapa
  drawMinimap();
}

function drawMinimap() {
  miniCtx.clearRect(0, 0, 110, 110);
  let sc = 110 / W;

  miniCtx.fillStyle = '#ff4757';
  rivals.forEach(r => {
    miniCtx.beginPath();
    miniCtx.arc(r.x * sc, r.y * sc, 2, 0, Math.PI * 2);
    miniCtx.fill();
  });

  miniCtx.fillStyle = '#14f195';
  miniCtx.beginPath();
  miniCtx.arc(player.x * sc, player.y * sc, 3.5, 0, Math.PI * 2);
  miniCtx.fill();
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

// UI Modais
const openModal = id => $(id).style.display = 'flex';
$('shop-btn').onclick = () => openModal('shop-modal');$('info-btn').onclick = () => openModal('info-modal');
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => $(b.dataset.close).style.display = 'none');

$('bot-btn').onclick = () => {
  player.autoBot = !player.autoBot;
  $('bot-btn').textContent = '🤖 AUTO-BOT: ' + (player.autoBot ? 'ON' : 'OFF');
  $('bot-btn').classList.toggle('on', player.autoBot);
};

requestAnimationFrame(loop);
</script>
</body>
</html>
